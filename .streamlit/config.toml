[server]
headless = false
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 500

[browser]
gatherUsageStats = false

[logger]
hideWelcomeMessage = true

[client]
toolbarMode = "minimal"

# One fixed dark theme (colours match styles.py). Setting it here means every Streamlit
# widget uses the same palette, whatever the visitor's browser prefers.
[theme]
base = "dark"
primaryColor = "#e58a4e"
backgroundColor = "#131211"
secondaryBackgroundColor = "#1d1c1a"
textColor = "#ece8e1"
borderColor = "#34312d"
baseRadius = "8px"
font = "IBM Plex Sans, system-ui, sans-serif"
headingFont = "Newsreader, Georgia, serif"
codeFont = "IBM Plex Mono, ui-monospace, monospace"
